<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>
<body>
    <main>
        <header class="battlefield-header">
            <p class="eyebrow">Naval Command</p>
            <h1>Battleship</h1>
            <p class="subheading">Deploy your fleet. Track enemy movement. Dominate the sea.</p>
        </header>

        <section class="command-panel">
            <div id="game-status" role="status" aria-live="polite"></div>
            <div class="command-actions">
                <button id="randomize-ships" class="command-button" type="button">Randomize Ships</button>
                <button id="start-battle" class="command-button" type="button">Start Battle</button>
            </div>
        </section>

        <div class="boards">
            <section class="board-section">
                <h2>Your Fleet</h2>
                <div id="player-board" aria-label="Your fleet"></div>
            </section>

            <section class="board-section">
                <h2>Enemy Waters</h2>
                <div id="computer-board" aria-label="Enemy waters"></div>
            </section>
        </div>
    </main>
</body>
</html>
